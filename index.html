<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitAppT</title>
    <style>
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0) scale(1);
            }
            40% {
                transform: translateY(-30px) scale(1.1);
            }
            60% {
                transform: translateY(-15px) scale(1.05);
            }
        }

        body {
            background-image: url('bg2.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .title {
            color: black;
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            margin-top: 20px;
            font-size: 200px;
            color-scheme: light dark;
        }
        .text-item {
            margin: 10px;
            font-size: 20px;
            font-family: 'Times New Roman', Times, serif;
            color: yellow;
            background-color: rgb(0, 0, 0); /* Highlight color */
            padding: 5px;
            border-radius: 5px;
        }
        .bounce {
            animation: bounce 0.7s;
        }
        .darkButton {
            margin: 10px;
            padding: 10px;
            font-size: 20px;
            font-family: 'Times New Roman', Times, serif;
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .genButton {
            margin: 10px;
            padding: 10px;
            font-size: 20px;
            font-family: 'Times New Roman', Times, serif;
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .dark-mode {
            background-image: url('bg.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            color: white;
        }
        .dark-mode .text-item {
            color: rgb(69, 69, 255);
            background-color: rgb(255, 255, 255);
        }
        .dark-mode .darkButton, .dark-mode .genButton {
            background-color: white;
            color: black;
        }
        .dark-mode .title {
            color: white;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1 class="title">III</h1>
    <button id="darkMode" class="darkButton">Dark Mode</button>
    <button id="generateButton" class="genButton">Generate</button>
    <div id="textItem1" class="text-item"></div>
    <div id="textItem2" class="text-item"></div>
    <div id="textItem3" class="text-item"></div>
    <div id="textItem4" class="text-item"></div>
    <div id="parkourSection" class="hidden">
        <button id="parkourButton1" class="genButton">Generate Parkour Move 1</button>
        <div id="parkourItem1" class="text-item"></div>
        <button id="parkourButton2" class="genButton">Generate Parkour Move 2</button>
        <div id="parkourItem2" class="text-item"></div>
        <button id="parkourButton3" class="genButton">Generate Parkour Move 3</button>
        <div id="parkourItem3" class="text-item"></div>
    </div>
    <script src="selector.js"></script>
</body>
</html>
